# Apache -> git-http-backend (smart HTTP), anonymous read + write. This is git's own documented
# ScriptAlias recipe; Apache computes PATH_INFO for the CGI correctly (lighttpd does not).
ServerName git-config-server
ServerRoot /usr
Listen 80
PidFile /tmp/httpd.pid

# Absolute module paths — with only this file loaded (no base httpd.conf) HTTPD_ROOT=/usr, so
# the usual relative `modules/` resolves to the wrong /usr/modules. Alpine puts them here.
# prefork + mod_cgi is the canonical, most-tested combo for git-http-backend; mpm_event's
# mod_cgid mis-stats the CGI with PATH_INFO ("script not found or unable to stat").
LoadModule mpm_prefork_module /usr/lib/apache2/mod_mpm_prefork.so
LoadModule authz_core_module  /usr/lib/apache2/mod_authz_core.so
LoadModule alias_module       /usr/lib/apache2/mod_alias.so
LoadModule env_module         /usr/lib/apache2/mod_env.so
LoadModule cgi_module         /usr/lib/apache2/mod_cgi.so
LoadModule unixd_module       /usr/lib/apache2/mod_unixd.so
LoadModule log_config_module  /usr/lib/apache2/mod_log_config.so

User apache
Group apache

ErrorLog  /dev/stderr
CustomLog /dev/stdout common
ServerTokens Prod

SetEnv GIT_PROJECT_ROOT /srv/git
SetEnv GIT_HTTP_EXPORT_ALL

# git's canonical ScriptAliasMatch: match only the git smart-HTTP URLs and hand the captured
# path to git-http-backend as PATH_INFO ($1). A plain trailing-slash ScriptAlias mis-routes —
# Apache appends the path to the binary and cgid then fails to stat "…/git-http-backend/<repo>…"
# ("script not found"). The (?x) makes the regex whitespace-insensitive.
ScriptAliasMatch "(?x)^/(.*/(HEAD|info/refs|objects/(info/[^/]+|[0-9a-f]{2}/[0-9a-f]{38,}|pack/pack-[0-9a-f]{40,}\.(pack|idx))|git-(upload|receive)-pack))$" /usr/libexec/git-core/git-http-backend/$1

<Directory "/usr/libexec/git-core">
    Options +ExecCGI
    Require all granted
</Directory>

# Raw config files for the Traefik HTTP provider: GET /config/<gateway>/dynamic.yaml, served from
# the post-receive checkout (entrypoint.sh) at /var/www/config. This is the read path that
# replaces the per-VM git-pull sync — a spoke's --providers.http.endpoint points here.
#
# AliasMatch "^/config/" REQUIRES the trailing slash, so it can never match "/config.git/…" (a
# dot, not a slash, follows "config" there) — raw serving and the git smart-HTTP ScriptAliasMatch
# above stay disjoint.
AliasMatch "(?x)^/config/(.*)$" "/var/www/config/$1"
<Directory "/var/www/config">
    Require all granted
    Options -Indexes
    # Traefik's http provider decodes the body as YAML regardless of content-type; set it anyway
    # for correctness (curl, caches).
    <FilesMatch "\.ya?ml$">
        ForceType application/yaml
    </FilesMatch>
</Directory>
